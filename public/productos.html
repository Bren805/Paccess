</main>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";

import {
    getFirestore,
    collection,
    getDocs
}
from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";


/* FIREBASE */

const firebaseConfig = {

    apiKey: "AIzaSyB-joifAiA-sXI4c7j2MDKazz2omKzPD80",

    authDomain: "access-store-8955f.firebaseapp.com",

    projectId: "access-store-8955f",

    storageBucket: "access-store-8955f.firebasestorage.app",

    messagingSenderId: "999710580545",

    appId: "1:999710580545:web:31d37babe33098af464bc0"

};


const app = initializeApp(firebaseConfig);

const db = getFirestore(app);


/* ELEMENTOS */

const contenedor =
    document.getElementById("productos");

const sinProductos =
    document.getElementById("sinProductos");

const buscador =
    document.getElementById("buscador");

const categoria =
    document.getElementById("categoria");

const orden =
    document.getElementById("orden");

const btnOfertas =
    document.getElementById("btnOfertas");

const tituloProductos =
    document.getElementById("tituloProductos");


/* VARIABLES */

let productos = [];

let mostrandoOfertas = false;


/* CARGAR PRODUCTOS */

async function cargarProductos(){

    try{

        const snapshot =
            await getDocs(
                collection(db, "productos")
            );

        productos = [];

        snapshot.forEach((doc) => {

            productos.push({

                id: doc.id,

                ...doc.data()

            });

        });

        mostrarProductos();

    }

    catch(error){

        console.error(error);

        contenedor.innerHTML = `

            <div class="col-span-full text-center text-red-400">

                Error cargando productos ❌

            </div>

        `;

    }

}


/* MOSTRAR PRODUCTOS */

function mostrarProductos(){

    let resultado =
        [...productos];


    /* BUSCADOR */

    const texto =
        buscador.value
            .toLowerCase()
            .trim();


    if(texto){

        resultado =
            resultado.filter(producto =>

                producto.nombre
                    ?.toLowerCase()
                    .includes(texto)

            );

    }


    /* CATEGORIA */

    const categoriaSeleccionada =
        categoria.value;


    if(
        categoriaSeleccionada !== "todas"
        &&
        !mostrandoOfertas
    ){

        resultado =
            resultado.filter(producto =>

                producto.categoria
                    ?.toLowerCase()
                    === categoriaSeleccionada

            );

    }


    /* OFERTAS */

    if(mostrandoOfertas){

        resultado =
            resultado.filter(producto =>

                producto.enOferta === true

            );

    }


    /* ORDEN */

    if(orden.value === "menor"){

        resultado.sort(
            (a,b) =>
                Number(a.precio) -
                Number(b.precio)
        );

    }

    if(orden.value === "mayor"){

        resultado.sort(
            (a,b) =>
                Number(b.precio) -
                Number(a.precio)
        );

    }


    /* LIMPIAR */

    contenedor.innerHTML = "";


    /* SIN PRODUCTOS */

    if(resultado.length === 0){

        sinProductos.classList.remove("hidden");

        return;

    }

    sinProductos.classList.add("hidden");


    /* TARJETAS */

    resultado.forEach(producto => {

        const enOferta =
            producto.enOferta === true;

        const precioOriginal =
            Number(producto.precio);

        const precioFinal =
            enOferta &&
            producto.precioOferta
                ? Number(producto.precioOferta)
                : precioOriginal;


        let descuento = 0;

        if(enOferta && precioFinal < precioOriginal){

            descuento =
                Math.round(
                    (
                        1 -
                        precioFinal /
                        precioOriginal
                    ) * 100
                );

        }


        contenedor.innerHTML += `

        <article class="glass rounded-3xl overflow-hidden hover:-translate-y-1 transition duration-300">

            <div class="relative">

                <img
                    src="${producto.imagen}"
                    class="w-full h-52 object-cover"
                />

                ${
                    enOferta
                    ?
                    `
                    <span class="absolute top-3 left-3 bg-red-500 text-white text-xs font-bold px-3 py-1 rounded-full">

                        🔥 ${descuento}% OFF

                    </span>
                    `
                    :
                    ""
                }

            </div>


            <div class="p-5">

                <p class="text-zinc-500 text-sm">

                    ${producto.categoria || ""}

                </p>


                <h3 class="text-xl font-bold mt-1">

                    ${producto.nombre}

                </h3>


                <div class="mt-4">

                    ${
                        enOferta
                        ?
                        `
                        <div class="flex items-center gap-3">

                            <span class="text-zinc-500 line-through">

                                $${precioOriginal}

                            </span>

                            <span class="text-violet-300 font-black text-2xl">

                                $${precioFinal}

                            </span>

                        </div>
                        `
                        :
                        `
                        <span class="text-violet-300 font-black text-2xl">

                            $${precioOriginal}

                        </span>
                        `
                    }

                </div>


                <button
                    onclick="agregarCarrito('${producto.id}', '${producto.nombre}', ${precioFinal})"
                    class="w-full mt-5 bg-violet-500 hover:bg-violet-600 transition py-3 rounded-xl font-bold flex items-center justify-center gap-2"
                >

                    <span class="material-symbols-outlined">
                        shopping_cart
                    </span>

                    Agregar al carrito

                </button>

            </div>

        </article>

        `;

    });

}


/* CARRITO */

window.agregarCarrito = async function(productoId, nombre, precio){

    const usuarioGuardado =
        localStorage.getItem("usuario");


    // Si no inició sesión

    if(!usuarioGuardado){

        const quiereIngresar =
            confirm(
                "Para usar el carrito tenés que iniciar sesión.\n\n¿Querés iniciar sesión?"
            );


        if(quiereIngresar){

            window.location.href = "login.html";

        }

        return;

    }


    const usuario =
        JSON.parse(usuarioGuardado);


    try{

        const response =
            await fetch("/carrito", {

                method: "POST",

                headers: {

                    "Content-Type":
                        "application/json"

                },

                body: JSON.stringify({

                    usuario_id: usuario.id,

                    producto_id: productoId,

                    nombre: nombre,

                    precio: precio

                })

            });


        const data =
            await response.json();


        if(!response.ok){

            alert(
                data.error ||
                "Error agregando el producto al carrito"
            );

            return;

        }


        alert(
            nombre +
            " agregado al carrito 🛒"
        );


    }
    catch(error){

        console.error(error);

        alert(
            "Error conectando con el servidor ❌"
        );

    }

};

/* INICIAR */

cargarProductos();

</script>
