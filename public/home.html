<!DOCTYPE html>
<html class="dark" lang="es">

<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>

<title>ACCESS | Home</title>

<script src="https://cdn.tailwindcss.com"></script>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet"/>

<style>

body{
    background:#131313;
    color:white;
    font-family:'Geist',sans-serif;
}

.glass{
    background:rgba(26,26,26,0.8);
    border:1px solid rgba(208,188,255,0.1);
    backdrop-filter:blur(10px);
}

</style>

</head>

<body class="overflow-x-hidden pb-24">

<!-- HEADER -->

<header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-5 h-16 bg-black/80 backdrop-blur-xl border-b border-zinc-800">

<div class="flex items-center gap-3">

<button
    id="menuBtn"
    class="text-violet-400 hover:text-violet-300 transition"
    aria-label="Abrir menú"
>
    <span class="material-symbols-outlined text-3xl">
        menu
    </span>
</button>

<h1 class="text-2xl font-black tracking-tighter text-violet-300">
ACCESS
</h1>

</div>

<div class="flex items-center gap-5">

    <span class="material-symbols-outlined text-zinc-300">
        search
    </span>


    <!-- CUENTA -->

    <div class="relative">

        <button
            id="cuentaBtn"
            class="text-violet-300 hover:text-violet-200 transition"
            aria-label="Cuenta"
        >

            <span class="material-symbols-outlined text-3xl">
                account_circle
            </span>

        </button>


        <!-- MENÚ DE CUENTA -->

        <div
            id="cuentaMenu"
            class="hidden absolute right-0 mt-3 w-56 glass rounded-2xl p-3 shadow-2xl"
        >

            <!-- SIN SESIÓN -->

            <div id="sinSesion">

                <a
                    href="login.html"
                    class="block px-4 py-3 rounded-xl text-zinc-300 hover:bg-violet-500/10 hover:text-violet-300 transition"
                >
                    Iniciar sesión
                </a>

                <a
                    href="register.html"
                    class="block px-4 py-3 rounded-xl text-zinc-300 hover:bg-violet-500/10 hover:text-violet-300 transition"
                >
                    Registrarse
                </a>

            </div>


            <!-- CON SESIÓN -->

<div id="conSesion" class="hidden">

    <a
        href="cuenta.html"
        class="block px-4 py-3 rounded-xl text-zinc-300 hover:bg-violet-500/10 hover:text-violet-300 transition"
    >
        Mi cuenta
    </a>

    <button
        id="cerrarSesion"
        class="w-full text-left px-4 py-3 rounded-xl text-zinc-300 hover:bg-red-500/10 hover:text-red-400 transition"
    >
        Cerrar sesión
    </button>

</div>

    <!-- CARRITO -->

    <button
    id="carritoBtn"
    class="text-violet-300 hover:text-violet-200 transition"
    aria-label="Carrito"
>

    <span class="material-symbols-outlined text-3xl">
        shopping_cart
    </span>

</button>
</div>

</header>
<!-- MENÚ DESPLEGABLE -->

<div
    id="menu"
    class="fixed top-16 left-0 w-72 bg-[#131313]/95 backdrop-blur-xl border-r border-b border-zinc-800 z-40 transform -translate-x-full transition-transform duration-300"
>

    <nav class="p-6 space-y-3">

        <a
            href="home.html"
            class="block px-4 py-3 rounded-xl text-zinc-300 hover:bg-violet-500/10 hover:text-violet-300 transition"
        >
            Inicio
        </a>

        <a
            href="productos.html"
            class="block px-4 py-3 rounded-xl text-zinc-300 hover:bg-violet-500/10 hover:text-violet-300 transition"
        >
            Productos
        </a>

        <a
            href="cart.html"
            class="block px-4 py-3 rounded-xl text-zinc-300 hover:bg-violet-500/10 hover:text-violet-300 transition"
        >
            Carrito
        </a>

    </nav>

</div>

<!-- HERO -->

<section class="relative h-[500px] flex items-center justify-center text-center overflow-hidden">

<img
src="https://images.unsplash.com/photo-1518770660439-4636190af475?q=80&w=1600&auto=format&fit=crop"
class="absolute inset-0 w-full h-full object-cover opacity-30"
/>

<div class="absolute inset-0 bg-gradient-to-b from-transparent to-[#131313]"></div>

<div class="relative z-10 px-6">

<h1 class="text-5xl font-black text-violet-300 mb-5 tracking-tighter">
ACCESS
</h1>

<p class="text-zinc-300 max-w-md mx-auto text-lg mb-8">
Tecnología premium, notebooks, gaming y accesorios de última generación.
</p>

<button class="bg-violet-500 hover:bg-violet-600 transition px-8 py-3 rounded-full font-bold">
Explorar Productos
</button>

</div>

</section>

<!-- PRODUCTOS -->

<main class="px-5 mt-10">

<h2 class="text-3xl font-bold mb-8">
Productos Destacados
</h2>

<section
id="productos"
class="grid grid-cols-1 md:grid-cols-2 gap-5">
</section>

</main>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";

import {
  getFirestore,
  collection,
  getDocs
} from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyB-joifAiA-sXI4c7j2MDKazz2omKzPD80",
  authDomain: "access-store-8955f.firebaseapp.com",
  projectId: "access-store-8955f",
  storageBucket: "access-store-8955f.firebasestorage.app",
  messagingSenderId: "999710580545",
  appId: "1:999710580545:web:31d37babe33098af464bc0"
};

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

const contenedor = document.getElementById("productos");

window.agregarCarrito = function(nombre, precio) {

  let carrito =
    JSON.parse(localStorage.getItem("carrito")) || [];

  carrito.push({
    nombre,
    precio
  });

  localStorage.setItem(
    "carrito",
    JSON.stringify(carrito)
  );

  alert(nombre + " agregado al carrito 🛒");

};

async function cargarProductos() {

  try {

    const querySnapshot = await getDocs(
      collection(db, "productos")
    );

    contenedor.innerHTML = "";

    if (querySnapshot.empty) {

      contenedor.innerHTML = `

      <div class="col-span-full text-center text-zinc-400">

        No hay productos cargados 😢

      </div>

      `;

      return;

    }

    querySnapshot.forEach((doc) => {

      const producto = doc.data();

      contenedor.innerHTML += `

      <div class="glass rounded-3xl overflow-hidden">

        <img
          src="${producto.imagen}"
          class="w-full h-56 object-cover"
        />

        <div class="p-5">

          <p class="text-zinc-400 text-sm">
            ${producto.categoria}
          </p>

          <h3 class="text-xl font-bold mt-1">
            ${producto.nombre}
          </h3>

          <div class="flex justify-between items-center mt-5">

            <span class="text-violet-300 font-bold text-xl">
              $${producto.precio}
            </span>

            <button
              onclick="agregarCarrito('${producto.nombre}', ${producto.precio})"
              class="material-symbols-outlined bg-violet-500 hover:bg-violet-600 transition p-3 rounded-full"
            >
              add_shopping_cart
            </button>

          </div>

        </div>

      </div>

      `;

    });

  } catch(error) {

    console.log(error);

    contenedor.innerHTML = `

    <div class="col-span-full text-center text-red-400">

      Error cargando productos ❌

    </div>

    `;

  }

}

cargarProductos();

</script>
<script>

const menuBtn = document.getElementById("menuBtn");
const menu = document.getElementById("menu");

menuBtn.addEventListener("click", () => {

    menu.classList.toggle("-translate-x-full");
    menu.classList.toggle("translate-x-0");

});
const cuentaBtn =
    document.getElementById("cuentaBtn");

const cuentaMenu =
    document.getElementById("cuentaMenu");

const sinSesion =
    document.getElementById("sinSesion");

const conSesion =
    document.getElementById("conSesion");

const cerrarSesion =
    document.getElementById("cerrarSesion");


// Abrir / cerrar menú

cuentaBtn.addEventListener("click", (event) => {

    event.stopPropagation();

    cuentaMenu.classList.toggle("hidden");

});


// Cerrar menú al hacer clic afuera

document.addEventListener("click", () => {

    cuentaMenu.classList.add("hidden");

});


// Evitar que el menú se cierre al tocarlo

cuentaMenu.addEventListener("click", (event) => {

    event.stopPropagation();

});


// Comprobar sesión

const usuarioGuardado =
    localStorage.getItem("usuario");


if(usuarioGuardado){

    sinSesion.classList.add("hidden");

    conSesion.classList.remove("hidden");

}
else{

    sinSesion.classList.remove("hidden");

    conSesion.classList.add("hidden");

}


// Cerrar sesión

cerrarSesion.addEventListener("click", () => {

    localStorage.removeItem("usuario");

    window.location.href = "home.html";

});
const carritoBtn =
    document.getElementById("carritoBtn");


carritoBtn.addEventListener("click", () => {

    const usuarioGuardado =
        localStorage.getItem("usuario");


    if(usuarioGuardado){

        window.location.href = "cart.html";

    }
    else{

        window.location.href = "login.html";

    }

});
</script>

</body>
</html>
